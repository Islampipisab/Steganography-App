# Paste inside the server { } block that proxies to Gunicorn (e.g. location /).
# Prevents "failed to fetch" on slow hide-barcode / extract-barcode for large images.

proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;
client_body_timeout 600s;
client_max_body_size 200M;
